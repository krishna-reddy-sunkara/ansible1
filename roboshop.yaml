- name: create and update instances and route53 records
  hosts: all
  connection: local
  vars:
    sg_id: sg-0027bf26309cfab1a
    ami_id: ami-0220d79f3f480ecf5
    domain_name: daws-92s.store
    env: dev
  #  action: create
    instances:
    - mongodb
    - catalogue
  tasks:
  - name: ec2 instance creation
    amazon.aws.ec2_instance:
     instance_type: "t3.micro"
     security_group: "{{ sg_id }}"
     image_id: "{{ ami_id }}"
     name: "{{ item }}-{{ env }}"
     tags:
      Project: roboshop
      Pomponent: "{{ item }}"
      Env: "{{ env }}"
      Name: "{{ item }}-{{ env }}"
    loop: "{{ instances }}" 
    register: ec2_output
    #when: action == "create"

  - name: print the outut
    ansible.builtin.debug:
     msg: "{{ ec2_output }}"  
    # when: action == "create" 

  
  - name: update the record
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}-{{ env }}.{{ domain_name }}" # mongodb.daws-92s.store
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      wait: true   
    loop: "{{ ec2_output.results }}" 
  #  when: action == "create"


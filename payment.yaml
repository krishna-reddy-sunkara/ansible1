- name: configure payment server
  hosts: payment
  become: yes
  tasks:
  - name: install python
    ansible.builtin.debug:
     name: "{{ item }}" 
     state: present
    loop:
    - python3 
    - gcc 
    - python3-devel 

  - name: creating system user
    ansible.builtin.user: 
     name: roboshop
     system: true
     home: /app
     shell: /sbin/nologin
     comment: "roboshop system user"

  - name: delete app directory
    ansible.builtin.file:
      path: /app
      state: absent      

  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory    

  - name: delete payment
    ansible.builtin.file:
     path: /tmp/payment.zip
     state: absent     

  - name: download payment
    ansible.builtin.get_url:
     url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip 
     dest: /tmp/payment.zip

  - name: unachive payment
    ansible.builtin.unarchive:
     src: /tmp/payment.zip
     dest: /app
     remote_src: yes   

  - name: install dependences
    ansible.builtin.pip:
     requirments: requirements.txt
     executable: pip3.9
    args:
     chdir: /app 

  - name: copy the payment service file
    ansible.builtin.template:
     src: payment.service 
     dest: /etc/systemd/system/payment.service

  - name: daemon reload
    ansible.builtin.systemd_service:
     daemon_reload: ture

  - name: start and enable payment
    ansible.builtin.service:
     name: payment
     state: restarted
     enabled: yes

    
   
- name: redis setup
  hosts: redis
  become: yes
  tasks:
  - name: enable nodejs 7
    ansible.builtin.command: dnf module enable redis:7 -y
  
  - name: install redis
    ansible.builtin.dnf:
     name: redis
     state: present

  - name: allowing remote connections   
    ansible.builtin.replace:  
     path: /etc/redis/redis.conf
     regexp: '127.0.0.1'
     replace: '0.0.0.0'

  - name: allowing protected mode
    ansible.builtin.lineinfile:
     path: /etc/redis/redis.conf
     regexp: 'protected-mode' 
     line: 'protected-mode no' 
      
  - name: start and enabled redis
    ansible.builtin.service:
     name: redis
     state: restarted
     enabled: yes     


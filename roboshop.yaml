- name: create and update instances and route53 records
  hosts: all
  connection: local
  vars:
    sg_id: sg-0027bf26309cfab1a
    ami_id: ami-0220d79f3f480ecf5
    env: dev
    instances:
    - mongodb
    - catalogue
  tasks:
  - name: ec2 instance creation
    amazon.aws.ec2_instance:
     instance_type: "t3.micro"
     security_group: "{{ sg_id }}"
     image_id: "{{ ami_id }}"
     name: "{{ item }}-{{ env }}"
     tags:
      Project: roboshop
      Pomponent: "{{ item }}"
      Env: "{{ env }}"
      Name: "{{ name }}"
    loop: "{{ instances }}" 

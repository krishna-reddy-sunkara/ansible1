- name: print user name and password
  host: local
  connection: local
  vars_prompt:
  - name: user name
    prompt: please enter your name
    private: false
  - name: user password
    prompt: please enter your password
    private: yes

  tasks:
  - name: print info
    ansible.builtin.debug:
     msg: "user name is: {{ username }}, password is: {{ password }}"     
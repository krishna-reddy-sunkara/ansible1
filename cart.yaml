- name: cart setup
  hosts: cart
  become: yes
  tasks:
  - name: enable version
    ansible.builtin.command: dnf module enable nodejs:20 -y

  - name: installing nodejs
    ansible.builtin.dnf:
     name: nodejs
     state: present

  - name: creating system user
    ansible.builtin.user: 
     name: roboshop
     system: true
     home: /app
     shell: /sbin/nologin
     comment: "roboshop system user"

  - name: delete app directory
    ansible.builtin.file:
      path: /app
      state: absent      

  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory    

  - name: delete cart
    ansible.builtin.file:
     path: /tmp/cart.zip
     state: absent     

  - name: download cart
    ansible.builtin.get_url:
     url: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip 
     dest: /tmp/cart.zip

  - name: unachive cart
    ansible.builtin.unarchive:
     src: /tmp/cart.zip
     dest: /app
     remote_src: yes 

  - name: install npm depencies
    community.general.npm:   
     path: /app
  
  - name: copy service file
    ansible.builtin.template:
     src: cart.service
     dest: /etc/systemd/system/cart.service

  - name: deamon reload
    ansible.builtin.systems_reload:
    deamon_reload: true  

  - name: start the cart service
    ansible.builtin.service:
     name: cart
     state: restarted
     enabled: yes   
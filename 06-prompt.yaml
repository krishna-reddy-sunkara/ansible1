- name: print user name and password
  tasks: local
  connection: local
  vars_prompt:
   - name: user name
     prompt: please enter your name
     private: false

   - name: user passwod
     prompt: please enter your password
     private: true

  tasks:
   - name: print info
     ansible.builtin.debug:
      msg: "user name is: {{ name }}, user password is: {{ password }}"

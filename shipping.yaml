- name: configure shipping
  hosts: shipping
  become: yes
  tasks:
  - name: installing maven
    ansible.builtin.dnf:
     name: "{{ item }}"
     state: present
    loop:
    - maven
    - mysql  

  - name: creating system user
    ansible.builtin.user: 
     name: roboshop
     system: true
     home: /app
     shell: /sbin/nologin
     comment: "roboshop system user"

  - name: delete app directory
    ansible.builtin.file:
      path: /app
      state: absent      

  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory    

  - name: delete shipping
    ansible.builtin.file:
     path: /tmp/shipping.zip
     state: absent     

  - name: download shipping
    ansible.builtin.get_url:
     url: https://roboshop-artifacts.s3.amazonaws.com/shipping-v3.zip 
     dest: /tmp/shipping.zip

  - name: unachive shipping
    ansible.builtin.unarchive:
     src: /tmp/shipping.zip
     dest: /app
     remote_src: yes   

  - name: install dependencis 
    ansible.builtin.command: mvn clean package 
    args:
     chdir: /app

  - name: install dependencis 
    ansible.builtin.command: mv target/shipping-1.0.jar shipping.jar
    args:
     chdir: /app

  - name: systemctl copy service
    ansible.builtin.template: 
     src: shipping.service
     dest: /etc/systemd/system/shipping.service  

  # - name: install mysql package
  #   ansible.builtin.dnf:
  #    name: mysql
  #    state: present

  - name: deamon reload
    ansible.builtin.systemd_service:
     daemon_reload: true

  - name: import shipping data
    community.mysql.mysql_db:
     state: import
     name: all
     login_host: "{{ MYSQL_HOST }}"
     login_user: root
     login_password: RoboShop@1
     target: "{{ item }}"
    loop:
    - /app/db/schema.sql
    - /app/db/app-user.sql    
    - /app/db/master-data.sql

  - name: start and enabled shipping
    ansible.builtin.service:
     name: shipping
     state: started
     enabled: yes   

   
    